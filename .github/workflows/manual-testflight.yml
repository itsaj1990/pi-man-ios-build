# COPY TO THE TEMPORARY PUBLIC REPOSITORY AS:
# .github/workflows/manual-testflight.yml
# NEVER enable push, pull_request or scheduled triggers on the public repository.
name: PI Man - manual TestFlight only
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Next TestFlight build number (greater than current App Store Connect build)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pi-man-manual-testflight
  cancel-in-progress: false

jobs:
  ios-testflight:
    runs-on: macos-26-intel
    timeout-minutes: 60
    environment: ios-testflight
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare native Xcode project
        run: |
          brew install xcodegen openssl@3
          swift ios/scripts/generate-app-icon.swift public/icons/pi-man-512.png ios/PIMan/Assets.xcassets/AppIcon.appiconset/PIManIcon-1024.png
          bash ios/scripts/configure-google-signin.sh
          xcodegen generate --spec ios/project.yml --project ios
      - name: Force native iOS routing to the sandbox preview
        run: |
          /usr/libexec/PlistBuddy -c "Set :PIManEnvironment sandbox" ios/PIMan/Info.plist
          selected="$(/usr/libexec/PlistBuddy -c 'Print :PIManEnvironment' ios/PIMan/Info.plist)"
          test "$selected" = "sandbox"
      - name: Sign, archive and upload PI Man
        env:
          PI_MAN_BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: bash ios/scripts/upload-testflight.sh
