name: PIMan
options:
  bundleIdPrefix: com.piman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: R6G37PYF87
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
targets:
  PIMan:
    type: application
    platform: iOS
    sources:
      - path: PIMan
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: PIMan/PIMan.entitlements
        # Apply the manual App Store profile only to the PIMan app target;
        # SPM dependencies (GoogleSignIn, AppAuth, etc.) do not support profiles.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "PIMan AppStore"
        PRODUCT_BUNDLE_IDENTIFIER: com.piman.app
        PRODUCT_NAME: PIMan
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: PIMan/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
